spring.application.name=rag-chat-client
server.port=8080

# Spring AI config
spring.ai.model.chat=openai
spring.ai.model.embedding=ollama

# OpenAI config
spring.ai.openai.base-url=${INFERENCE_URL}
spring.ai.openai.api-key=ignored
spring.ai.openai.chat.options.model=${INFERENCE_MODEL}
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.chat.max-tokens=512
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.timeout=10m
spring.ai.openai.max-retries=1

# Ollama config
spring.ai.ollama.base-url=${OLLAMA_URL}
spring.ai.ollama.embedding.options.model=${OLLAMA_MODEL:nomic-embed-text}
spring.ai.ollama.init.timeout=5m

# Vector store: opensearch | pgvector
spring.ai.vectorstore.type=${VECTORSTORE_TYPE}

# Opensearch config
spring.ai.vectorstore.opensearch.aws.enabled=false
spring.ai.vectorstore.opensearch.uris=${OPENSEARCH_URI:}
spring.ai.vectorstore.opensearch.username=${OPENSEARCH_USERNAME:}
spring.ai.vectorstore.opensearch.password=${OPENSEARCH_PASSWORD:}
spring.ai.vectorstore.opensearch.index-name=${OPENSEARCH_INDEX:url-docs}
spring.ai.vectorstore.opensearch.initialize-schema=true

# PGVector config
spring.datasource.url=${POSTGRES_URL:}
spring.datasource.username=${POSTGRES_USERNAME:}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.ai.vectorstore.pgvector.initialize-schema=true

# RAG config
app.rag.top-k=5
app.rag.ingest.batch-size=16
app.rag.ingest.chunk-size=300

management.endpoints.web.exposure.include=health,metrics,prometheus
